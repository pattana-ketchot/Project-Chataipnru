# Production stack — รันทั้ง 4 ส่วนใน Docker บนเซิร์ฟเวอร์เดียว
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# ต่างจาก docker-compose.yml (ใช้ตอนพัฒนา) ตรงที่:
#   - รวม backend และ frontend เข้ามาด้วย ไม่ต้องรันมือ
#   - postgres กับ ollama ไม่เปิดพอร์ตออกนอกเครื่อง ให้คุยกันในเครือข่ายของ compose
#   - เปิดสู่ภายนอกพอร์ตเดียวคือเว็บ
#
# ออกแบบสำหรับ Oracle Cloud Always Free (ARM Ampere, ไม่มี GPU) ซึ่งหมายความว่า
# โมเดลทำงานบน CPU และตอบช้ากว่าบนเครื่องที่มีการ์ดจอมาก — ดู docs/DEPLOY_ORACLE_CLOUD.md

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: course_advisor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้งค่าใน .env}
      ADVISOR_API_PASSWORD: ${ADVISOR_API_PASSWORD:?ต้องตั้งค่าใน .env}
      ADVISOR_INGEST_PASSWORD: ${ADVISOR_INGEST_PASSWORD:?ต้องตั้งค่าใน .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/20-roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_advisor"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # บนเครื่องที่ไม่มี GPU การโหลดโมเดลกลับเข้าหน่วยความจำใช้เวลานานกว่าเดิมอีก
      # จึงถือไว้นานขึ้น และ backend ยังยิง warmup เป็นระยะอยู่แล้ว
      OLLAMA_KEEP_ALIVE: "60m"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      # context ต้องเป็น root ของ repo เพราะ backend import แพ็กเกจ llm/
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      # ในเครือข่ายของ compose เรียกกันด้วยชื่อ service ไม่ใช่ 127.0.0.1
      DATABASE_URL: postgresql+psycopg://advisor_api:${ADVISOR_API_PASSWORD}@postgres:5432/course_advisor
      OLLAMA_BASE_URL: http://ollama:11434
      # สลับผู้ให้บริการโมเดลที่เขียนคำตอบได้จาก .env โดยไม่ต้อง build ใหม่
      # ค่าเริ่มต้นคือโมเดลในเครื่อง ตั้ง LLM_PROVIDER=gemini เมื่อมี GEMINI_API_KEY แล้ว
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      JWT_SECRET: ${JWT_SECRET:?ต้องตั้งค่าใน .env}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      # หน้าเว็บเรียก API ผ่าน origin เดียวกันอยู่แล้ว จึงไม่ต้องตั้ง CORS
      # แต่ใส่ไว้เผื่อมีการเรียกตรงจากเครื่องมือทดสอบ
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["http://localhost:3000"]}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* ถูกฝังลง bundle ของเบราว์เซอร์ตอน build ตั้งตอนรันไม่มีผล
        # ค่านี้ทำให้เบราว์เซอร์เรียก API เป็น path สัมพัทธ์ จึงอยู่ origin เดียวกับหน้าเว็บ
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # อ่านตอนรันโดย app/api/[...path]/route.ts — ย้าย backend ได้โดยไม่ต้อง build ใหม่
      BACKEND_ORIGIN: http://backend:8000
    # ไม่เปิดพอร์ตออกภายนอกแล้ว Caddy เป็นตัวเดียวที่รับคำขอจากข้างนอก
    expose:
      - "3000"

  # ตัวรับคำขอจากภายนอก ทำหน้าที่ขอและต่ออายุใบรับรอง HTTPS ให้อัตโนมัติ
  #
  # ต้องเปิดพอร์ต 443 ทั้งใน Security List ของ OCI และใน iptables ของเครื่องเอง
  # (กับดักสองชั้นเดียวกับตอนเปิดพอร์ต 80 — ดู docs/DEPLOY_ORACLE_CLOUD.md)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      # ชื่อโดเมนที่ขอใบรับรอง ถ้ายังไม่มีโดเมนให้ปล่อยว่างไว้ ระบบยังเข้าทาง IP ได้ปกติ
      # ค่าตั้งต้นเป็น localhost โดยตั้งใจ ไม่ใช่ค่าว่าง — ค่าว่างทำให้ Caddyfile มีบล็อก
      # ที่ไม่มีชื่อเว็บ ซึ่งเป็นไวยากรณ์ผิดและ Caddy จะไม่ยอมเริ่มทำงานเลย แปลว่าเว็บ
      # ล่มทั้งเว็บเพียงเพราะยังไม่ได้ตั้งชื่อโดเมน
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # เก็บใบรับรองไว้ข้ามการรีสตาร์ต ไม่งั้นจะขอใหม่ทุกครั้งจนชนเพดานของ
      # Let's Encrypt (ออกให้ชื่อเดิมได้ 5 ใบต่อสัปดาห์) แล้วขอไม่ได้ไปทั้งสัปดาห์
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  ollama_models:
