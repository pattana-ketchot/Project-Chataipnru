<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Tahoma','Segoe UI','Leelawadee UI',sans-serif">
<defs><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22B8D8"/><stop offset="100%" stop-color="#2F6BE0"/></linearGradient><radialGradient id="bgA" cx="0" cy="0" r="1"><stop offset="0%" stop-color="#DCE7FA"/><stop offset="100%" stop-color="#ffffff"/></radialGradient><radialGradient id="bgB" cx="1" cy="1" r="1"><stop offset="0%" stop-color="#DFF3F8"/><stop offset="100%" stop-color="#ffffff"/></radialGradient></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<rect width="1920" height="1080" fill="url(#bgA)" opacity="0.55"/>
<rect width="1920" height="1080" fill="url(#bgB)" opacity="0.5"/>
<rect x="46" y="28" width="1828" height="1024" rx="10" fill="#ffffff" opacity="0.92"/>
<text x="100" y="70" font-size="19" fill="#64748B" font-weight="normal" text-anchor="start">Database Design</text>
<text x="100" y="96" font-size="19" fill="#64748B">for the <tspan font-weight="bold" fill="#0F172A">SCI Advisor System</tspan></text>
<text x="1820" y="70" font-size="21" fill="#0F172A" font-weight="bold" text-anchor="end">4123204</text>
<text x="1820" y="96" font-size="19" fill="#64748B" font-weight="normal" text-anchor="end">Advanced Database</text>
<text x="960.0" y="192" text-anchor="middle" font-size="48" font-weight="bold" fill="#0F172A">การทำให้เป็น<tspan fill="url(#hl)">บรรทัดฐาน</tspan>และข้อยกเว้นที่ตั้งใจ</text>
<text x="960.0" y="236" font-size="21" fill="#64748B" font-weight="normal" text-anchor="middle">ทุกการตัดสินใจด้านล่างนี้ตรวจได้จากโครงสร้างจริงของฐานข้อมูล ไม่ใช่การอธิบายย้อนหลัง</text>
<rect x="70" y="288" width="574" height="400" rx="18" fill="#ffffff" stroke="#BFE6EE" stroke-width="1.8"/>
<circle cx="122" cy="342" r="21" fill="#0B7C90"/>
<text x="122" y="350" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="158" y="336" font-size="22" fill="#0F172A" font-weight="bold" text-anchor="start">ทำตามหลักเต็มที่</text>
<text x="158" y="362" font-size="15" fill="#0B7C90" font-weight="normal" text-anchor="start">(1NF – 3NF)</text>
<text x="102" y="416" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">user_profiles ใช้ user_id เป็นทั้งคีย์หลักและ</text>
<text x="102" y="445" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">คีย์นอก บังคับความสัมพันธ์ 1:1 ที่ระดับโครงสร้าง</text>
<text x="102" y="474" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">ไม่ต้องพึ่งการตรวจในโค้ด</text>
<text x="102" y="532" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">user_requirements และ chat_messages แยกเป็น</text>
<text x="102" y="561" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">ตารางของตัวเอง เพราะหนึ่งคนมีได้หลายเงื่อนไข</text>
<text x="102" y="590" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">และหนึ่งบทสนทนามีได้หลายข้อความ ไม่เก็บเป็น</text>
<text x="102" y="619" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">คอลัมน์ซ้ำ ๆ ในตารางแม่</text>
<rect x="672" y="288" width="574" height="400" rx="18" fill="#ffffff" stroke="#BFE6EE" stroke-width="1.8"/>
<circle cx="724" cy="342" r="21" fill="#0B7C90"/>
<text x="724" y="350" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="760" y="336" font-size="22" fill="#0F172A" font-weight="bold" text-anchor="start">จงใจเก็บซ้ำ เพื่อความเร็ว</text>
<text x="760" y="362" font-size="15" fill="#0B7C90" font-weight="normal" text-anchor="start">(Denormalization)</text>
<text x="704" y="416" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">course_chunks เก็บทั้ง course_id และ</text>
<text x="704" y="445" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">document_id ทั้งที่ document_id สาวไปถึง</text>
<text x="704" y="474" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">course_id ได้อยู่แล้ว</text>
<text x="704" y="532" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">เหตุผล: ตอนค้นด้วยเวกเตอร์ต้องกรองตาม</text>
<text x="704" y="561" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">หลักสูตรพร้อมกัน การเก็บซ้ำทำให้ไม่ต้อง join</text>
<text x="704" y="590" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">ข้ามตารางทุกคำถาม ความถูกต้องยังถูกบังคับ</text>
<text x="704" y="619" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">ด้วยคีย์นอกทั้งสองเส้นตามเดิม</text>
<rect x="1274" y="288" width="574" height="400" rx="18" fill="#ffffff" stroke="#BFE6EE" stroke-width="1.8"/>
<circle cx="1326" cy="342" r="21" fill="#0B7C90"/>
<text x="1326" y="350" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="1362" y="336" font-size="22" fill="#0F172A" font-weight="bold" text-anchor="start">จงใจไม่ผูกความสัมพันธ์</text>
<text x="1362" y="362" font-size="15" fill="#0B7C90" font-weight="normal" text-anchor="start">(No Foreign Key by Design)</text>
<text x="1306" y="416" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">chat_answer_cache ไม่มีคีย์นอกเลยสักเส้น</text>
<text x="1306" y="445" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">ใช้ question_key เป็นคีย์หลักแทน</text>
<text x="1306" y="503" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">เพราะแคชผูกกับคำถาม ไม่ได้ผูกกับคน คำถาม</text>
<text x="1306" y="532" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">เดียวกันจากผู้ใช้คนไหนก็ใช้คำตอบเดิมได้</text>
<text x="1306" y="590" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">ลบทั้งตารางทิ้งระบบยังทำงานได้ปกติ แค่ช้าลง</text>
<text x="1306" y="619" font-size="17.5" fill="#334155" font-weight="normal" text-anchor="start">เพราะต้องคิดคำตอบใหม่</text>
<rect x="70" y="730" width="1780" height="200" rx="16" fill="#EAF7FA" stroke="#CBE9F0" stroke-width="1.6"/>
<text x="102" y="774" font-size="21" fill="#0B7C90" font-weight="bold" text-anchor="start">คีย์ห้ามซ้ำ (UNIQUE) — กันข้อมูลซ้ำที่ระดับฐานข้อมูล ไม่ใช่ที่โค้ด</text>
<rect x="102" y="792" width="414" height="112" rx="12" fill="#ffffff" stroke="#CBE9F0" stroke-width="1.4"/>
<text x="120" y="820" font-size="17" fill="#0B7C90" font-weight="bold" text-anchor="start">users</text>
<text x="120" y="845" font-size="16.5" fill="#0F172A" font-weight="bold" text-anchor="start">email</text>
<text x="120" y="872" font-size="14.5" fill="#64748B" font-weight="normal" text-anchor="start">ชนิด citext สมัครด้วยตัวพิมพ์</text>
<text x="120" y="892" font-size="14.5" fill="#64748B" font-weight="normal" text-anchor="start">ต่างกันแล้วซ้ำไม่ได้</text>
<rect x="536" y="792" width="414" height="112" rx="12" fill="#ffffff" stroke="#CBE9F0" stroke-width="1.4"/>
<text x="554" y="820" font-size="17" fill="#0B7C90" font-weight="bold" text-anchor="start">courses</text>
<text x="554" y="845" font-size="16.5" fill="#0F172A" font-weight="bold" text-anchor="start">code</text>
<text x="554" y="872" font-size="14.5" fill="#64748B" font-weight="normal" text-anchor="start">รหัสหลักสูตรห้ามซ้ำ</text>
<rect x="970" y="792" width="414" height="112" rx="12" fill="#ffffff" stroke="#CBE9F0" stroke-width="1.4"/>
<text x="988" y="820" font-size="17" fill="#0B7C90" font-weight="bold" text-anchor="start">course_documents</text>
<text x="988" y="845" font-size="16.5" fill="#0F172A" font-weight="bold" text-anchor="start">course_id + file_sha256</text>
<text x="988" y="872" font-size="14.5" fill="#64748B" font-weight="normal" text-anchor="start">อัปโหลดไฟล์เดิมเข้าหลักสูตร</text>
<text x="988" y="892" font-size="14.5" fill="#64748B" font-weight="normal" text-anchor="start">เดิมซ้ำไม่ได้</text>
<rect x="1404" y="792" width="414" height="112" rx="12" fill="#ffffff" stroke="#CBE9F0" stroke-width="1.4"/>
<text x="1422" y="820" font-size="17" fill="#0B7C90" font-weight="bold" text-anchor="start">course_chunks</text>
<text x="1422" y="845" font-size="16.5" fill="#0F172A" font-weight="bold" text-anchor="start">document_id + chunk_index</text>
<text x="1422" y="872" font-size="14.5" fill="#64748B" font-weight="normal" text-anchor="start">ประมวลผลเอกสารซ้ำ</text>
<text x="1422" y="892" font-size="14.5" fill="#64748B" font-weight="normal" text-anchor="start">ไม่สร้างท่อนซ้ำ</text>
</svg>
