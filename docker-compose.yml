version: "3.9"

# Dev/local stack: PostgreSQL(+pgvector) และ Ollama (Local LLM runtime)
# SECURITY: ports ผูกกับ 127.0.0.1 เท่านั้น ไม่ expose ออก 0.0.0.0 สู่ network
# ภายนอกโดย default — เปลี่ยนเมื่อ deploy จริงพร้อม auth/network policy ที่เหมาะสม

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: course_advisor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU (ถ้ามี): uncomment บรรทัดล่างและติดตั้ง nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollama_models:
